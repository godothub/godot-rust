name: Godot editor integration

on:
  workflow_call:
  pull_request:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/godot_rs/**"
      - "crates/godot_rs_buildd/**"
      - "crates/godot_rs_host/**"
      - "crates/godot_rs_macros/**"
      - "crates/godot_rs_api/**"
      - "example/**"
      - "tests/fixtures/editor_flow/**"
      - "tests/fixtures/editor_diagnostics/**"
      - "tests/fixtures/editor_setup/**"
      - "tests/fixtures/host_load/**"
      - "tests/fixtures/project_module/**"
      - "tools/create_apple_xcframework.py"
      - "tools/stage_macos_host.py"
      - "tools/stage_host.py"
      - "tools/stage_example_plugin.py"
      - "tools/stage_project_module.py"
      - "tools/test_editor_plugin.py"
      - "tools/test_godot_export.py"
      - "tools/test_native_desktop_export.py"
      - "tools/test_native_load.py"
      - "tools/test_native_hot_reload.py"
      - "tools/test_godot_load.py"
      - ".github/workflows/godot-editor-integration.yml"
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: godot-editor-integration-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  host-and-editor:
    name: Godot 4.4 Host, editor, and export (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            os: ubuntu-22.04
            archive: Godot_v4.4.1-stable_linux.x86_64.zip
            binary: Godot_v4.4.1-stable_linux.x86_64
            sha512: ef4e76880a514257175544952c61191106fdef3095b909bafed9fcbeb230c3e5533920a0f3012882dd4bbde83028a67549825794e2d2c3cf76eba7918b71370e
          - name: macOS
            os: macos-latest
            archive: Godot_v4.4.1-stable_macos.universal.zip
            binary: Godot.app/Contents/MacOS/Godot
            sha512: e72933ed15db495a29c918b27adc83596b6a4dc59ec72c927e1591333df14f0eb57c515a94f9f5a0ed8a13053d55f6aedf56f2a2d828add2ef3f79c698db714b
          - name: Windows x86_64
            os: windows-latest
            archive: Godot_v4.4.1-stable_win64.exe.zip
            binary: Godot_v4.4.1-stable_win64.exe
            sha512: 266978b803f7532edc69bdd5d8c4fdced0ea97aef1224a8879616398a2559e135520e186add06b532aa92bdfeecf6ac024634024de4b3abd69f6c34e6d6d0563
    runs-on: ${{ matrix.os }}
    env:
      GODOT_ARCHIVE: ${{ matrix.archive }}
      GODOT_SHA512: ${{ matrix.sha512 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install stable Rust
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: Install macOS Rust targets
        if: runner.os == 'macOS'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - name: Download official Godot 4.4 editor
        shell: bash
        run: |
          curl --fail --location --retry 3 \
            "https://github.com/godotengine/godot-builds/releases/download/4.4.1-stable/${GODOT_ARCHIVE}" \
            --output "${RUNNER_TEMP}/${GODOT_ARCHIVE}"
          python -c \
            'import hashlib, os, pathlib, sys; p=pathlib.Path(os.environ["RUNNER_TEMP"])/os.environ["GODOT_ARCHIVE"]; actual=hashlib.sha512(p.read_bytes()).hexdigest(); expected=os.environ["GODOT_SHA512"]; sys.exit(f"SHA-512 mismatch: {actual}") if actual != expected else None'
          python -m zipfile -e \
            "${RUNNER_TEMP}/${GODOT_ARCHIVE}" "${RUNNER_TEMP}/godot"
          chmod +x "${RUNNER_TEMP}/godot/${{ matrix.binary }}"
          echo "GODOT_BINARY=${RUNNER_TEMP}/godot/${{ matrix.binary }}" >> "${GITHUB_ENV}"
      - name: Build and load Host
        shell: bash
        run: python tools/test_godot_load.py --godot "${GODOT_BINARY}"
      - name: Create, attach, and build a Rust script
        shell: bash
        run: python tools/test_editor_plugin.py --godot "${GODOT_BINARY}"
      - name: Exercise diagnostics and save coalescing
        shell: bash
        run: >-
          python tools/test_editor_plugin.py
          --scenario diagnostics
          --godot "${GODOT_BINARY}"
      - name: Configure and build an existing Cargo package
        shell: bash
        run: >-
          python tools/test_editor_plugin.py
          --scenario setup
          --godot "${GODOT_BINARY}"
      - name: Export and run a Rust-script project
        shell: bash
        run: python tools/test_godot_export.py --godot "${GODOT_BINARY}"
      - name: Export and run an Extension Mode project
        shell: bash
        run: >-
          python tools/test_native_desktop_export.py
          --godot "${GODOT_BINARY}"
      - name: Hot-reload an Extension Mode project
        shell: bash
        run: >-
          python tools/test_native_hot_reload.py
          --godot "${GODOT_BINARY}"
