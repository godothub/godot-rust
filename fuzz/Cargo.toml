[package]
name = "godot-rust-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
serde_json = "1"
godot_rs_api = { path = "../crates/godot_rs_api" }
godot_rs_buildd = { path = "../crates/godot_rs_buildd" }
godot_rs_codegen = { path = "../crates/godot_rs_codegen" }

[[bin]]
name = "abi_wire"
path = "fuzz_targets/abi_wire.rs"
test = false
doc = false
bench = false

[[bin]]
name = "official_api"
path = "fuzz_targets/official_api.rs"
test = false
doc = false
bench = false

[[bin]]
name = "build_protocol"
path = "fuzz_targets/build_protocol.rs"
test = false
doc = false
bench = false

[workspace]
members = ["."]
