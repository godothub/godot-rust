[workspace]
members = [
    "crates/godot_rs",
    "crates/godot_rs_api_policy",
    "crates/godot_rs_buildd",
    "crates/godot_rs_codegen",
    "crates/godot_rs_host",
    "crates/godot_rs_macros",
    "crates/godot_rs_api",
    "tests/fixtures/native_extension",
    "tests/fixtures/project_module",
]
resolver = "2"

[workspace.package]
version = "0.9.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/godothub/godot-rust"
homepage = "https://github.com/godothub/godot-rust"

[workspace.dependencies]
bindgen = { version = "0.72.1", default-features = false, features = ["runtime"] }
godot_rs = { version = "0.9.0", path = "crates/godot_rs" }
godot_rs_api_policy = { path = "crates/godot_rs_api_policy" }
godot_rs_macros = { version = "0.9.0", path = "crates/godot_rs_macros" }
godot_rs_api = { version = "0.9.0", path = "crates/godot_rs_api" }
inventory = "0.3.24"
libloading = "0.8.9"
object = { version = "0.37.3", default-features = false, features = ["read", "std", "wasm"] }
proc-macro2 = { version = "1", features = ["span-locations"] }
quote = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
syn = { version = "2", features = ["full", "extra-traits"] }
toml = "1.1.3"
toml_edit = "0.25.13"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "deny"

[profile.dev]
debug = 1

[profile.release]
lto = "thin"
panic = "unwind"
strip = "debuginfo"
