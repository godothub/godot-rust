[package]
name = "godot_rs"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
description = "Godot-first Rust scripting SDK for the godot-rust editor plugin"
keywords = ["godot", "gamedev", "scripting", "plugin", "rust"]
categories = ["game-development", "api-bindings"]
exclude = ["benches/**", "tests/**"]
build = "build.rs"

[dependencies]
godot_macro.workspace = true
godot_api = { workspace = true, features = ["bindings"] }
inventory.workspace = true

[build-dependencies]
godot_api = { workspace = true, default-features = false, features = ["generator"] }

[dev-dependencies]
trybuild = "1.0.118"

[lib]
path = "src/lib.rs"

[[bench]]
name = "engine_api_hot_paths"
harness = false

[lints]
workspace = true
