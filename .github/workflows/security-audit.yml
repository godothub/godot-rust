name: Dependency security audit

on:
  pull_request:
    paths:
      - "Cargo.lock"
      - "Cargo.toml"
      - "crates/**/Cargo.toml"
      - ".github/workflows/security-audit.yml"
  schedule:
    - cron: "17 2 * * 1"
  workflow_dispatch:

concurrency:
  group: dependency-security-audit-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  rustsec:
    name: RustSec advisory database
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install cargo-audit
        run: cargo install cargo-audit --version 0.22.1 --locked
      - name: Audit locked dependencies
        run: cargo audit
